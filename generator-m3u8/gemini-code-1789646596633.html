<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <script>
        const apiUrl = 'https://danet.vn/api/movies/1558368097/episodes/1558371317/locations';

        async function fetchAndRedirect() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`Lỗi kết nối API: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Trích xuất file_location từ luồng đầu tiên
                const streamUrl = data?.streams?.[0]?.file_location;

                if (streamUrl) {
                    window.location.href = streamUrl;
                } else {
                    document.getElementById('status').innerText = '404';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'error code: ' + error.message;
            }
        }

        // Chạy hàm khi trang tải xong
        fetchAndRedirect();
    </script>
</body>
</html>
